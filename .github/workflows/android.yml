name: Android CI

# 说明：这里只做「能不能编译通过」的检查。
# 正式包（assembleRelease）需要 qcl.keystore，密钥不在仓库里（.gitignore 排除了），
# 所以 CI 不产出可发布的 release 包 —— 发版仍由维护者在本机签名出包。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ★ 项目必须 JDK 17（原来是 11，必然失败）。
      #   注意别升到 21：会让 dexBuilderRelease 挂 D8/R8 的 String.length() NPE。
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 模块早已从 HMCLPE 改名 QCL（原来上传路径写的 HMCLPE/...，必然找不到）
      - name: Build debug APK
        run: ./gradlew :QCL:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: QCL/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
